<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfeaff">
<title>우리 반 3D 우주 전시관</title>
<style>
:root{
  --ink:#2b2f3a; --mute:#6b7280; --line:#e5e7eb; --bg:#f6f8fc; --card:#fff;
  --orange:#e2574c; --orange2:#f08a5d; --green:#2e9b6a; --navy:#1c2550;
  --c-star:#ff7a59; --c-planet:#3b82f6; --c-satellite:#8b5cf6; --c-asteroid:#a16207; --c-comet:#0891b2; --c-dwarf:#db2777; --c-etc:#64748b;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:17px}
.screen{position:fixed;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.screen.show{display:block}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 40px rgba(30,40,80,.12);padding:28px;width:100%;max-width:560px}
h1.logo{font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 20px;line-height:1.6}
label.f{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
.inp{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:#7aa7ff}
.code-inp{font-size:34px;letter-spacing:10px;text-align:center;font-weight:800}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:800;background:#eef1f6;color:var(--ink);min-height:50px}
.btn.pri{background:var(--orange);color:#fff}
.btn.grn{background:var(--green);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.sm{padding:9px 12px;font-size:14px;min-height:40px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btnrow .btn{flex:1}
.err{color:#c62828;font-weight:700;min-height:22px;margin-top:10px;line-height:1.5}
.small{font-size:13px;color:var(--mute)}
a{color:#2f6fde}
.looks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.look{border:3px solid transparent;border-radius:14px;background:#f1f4f9;padding:6px 0;text-align:center;font-size:26px;min-height:54px}
.look.on{border-color:var(--orange);background:#fff1ee}
.look .dot{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto}
.hats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* world */
#world{background:#cfeaff;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:absolute;pointer-events:none;inset:0}
.hud *{pointer-events:auto}
.topbar{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.pill{pointer-events:auto;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:0;flex:0 1 auto;max-width:48%}
.pill .loc{background:#2b2f3a;color:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.pill .ttl{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .on{font-size:13px;color:var(--mute);white-space:nowrap}
.tbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tb{border:0;border-radius:999px;background:#fff;color:var(--ink);padding:10px 16px;font-size:15px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.12);min-height:44px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tb.or{background:var(--orange);color:#fff}
.tb.gr{background:var(--green);color:#fff}
.bottombar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(70,72,80,.72);backdrop-filter:blur(6px);border-radius:999px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.bottombar button{width:52px;height:52px;border-radius:50%;border:0;background:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:800}
.bottombar .sep{width:1px;height:36px;background:rgba(255,255,255,.35);margin:0 4px}
.bottombar .view{white-space:nowrap;width:auto;border-radius:999px;padding:0 16px;font-size:16px;background:var(--orange);color:#fff}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.75);touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.1)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2);pointer-events:none}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:rgba(43,47,58,.82);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;line-height:1.5;text-align:center;max-width:min(560px,86vw);pointer-events:none;transition:opacity .6s}
#obs{background:#070b1a;overflow:hidden}
#obs .obar{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#0b1230;border-bottom:1px solid #1f2a55}
#obs .pill{max-width:55%}
#obsFrame{position:absolute;left:0;right:0;top:64px;bottom:0;width:100%;height:calc(100% - 64px);border:0;background:#070b1a}
.tb.locked{background:#5b6380;color:#e6e9f5}
.tb.pulse{animation:pulse 1.2s ease-in-out 4}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(226,87,76,.35)}}
#act{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(96px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:var(--orange);color:#fff;font-size:20px;font-weight:900;padding:14px 26px;box-shadow:0 6px 20px rgba(226,87,76,.45);animation:pulse 1.4s ease-in-out infinite;z-index:3;white-space:nowrap}
.ticket{position:relative;display:flex;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:620px;margin:6px auto;background:#fff}
.ticket .l{flex:1;padding:22px 24px;background:linear-gradient(135deg,#1c2550,#3a2a6b);color:#fff}
.ticket .r{width:150px;padding:18px 12px;text-align:center;background:#fff7e6;border-left:3px dashed #e8c98a;display:flex;flex-direction:column;justify-content:center;gap:6px}
.ticket .l h3{margin:0 0 4px;font-size:15px;color:#ffd166;letter-spacing:2px}
.ticket .l h2{margin:0 0 12px;font-size:26px}
.ticket .l .who{font-size:20px;font-weight:800}
.ticket .stamp{display:inline-block;border:3px solid #e2574c;color:#e2574c;font-weight:900;border-radius:10px;padding:4px 10px;transform:rotate(-8deg);font-size:18px}
.albumpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0 14px;max-height:230px;overflow:auto}
.albumpick button{border:3px solid transparent;border-radius:12px;background:#0d1230;padding:4px;color:#fff;font-size:12px;font-weight:700}
.albumpick button.on{border-color:var(--green)}
.albumpick img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:#1c2550}
#cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.3);display:none;pointer-events:none}

/* modal */
#modal{position:fixed;inset:0;background:rgba(15,20,35,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.show{display:flex}
#mbox{background:#fff;border-radius:22px;width:100%;max-width:760px;max-height:calc(100% - 8px);overflow:auto;-webkit-overflow-scrolling:touch;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#mbox.wide{max-width:1000px}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:0;background:#f1f3f7;font-size:22px;font-weight:800;color:var(--ink);z-index:2}
#ask{position:fixed;inset:0;background:rgba(15,20,35,.5);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
#ask.show{display:flex}
#ask .card{max-width:420px;text-align:center}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#2b2f3a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.chip{display:inline-block;padding:3px 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:800}
.up{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pick{border:3px dashed #c9d3e3;border-radius:18px;min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-weight:700;background:#f8fafd;position:relative;overflow:hidden;font-size:17px;line-height:1.6;cursor:pointer}
.pick img{max-width:100%;max-height:320px;display:block}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.paste{background:#fff8e6;border:2px dashed #f2c46d;border-radius:12px;padding:10px;font-size:15px;min-height:56px}
.prog{height:10px;border-radius:99px;background:#eef1f6;overflow:hidden;margin-top:12px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.mine{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.mine .w{display:flex;align-items:center;gap:8px;background:#f4f6fa;border-radius:12px;padding:6px 8px 6px 6px}
.mine img{width:44px;height:44px;object-fit:cover;border-radius:8px}

.det{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.det .ph{background:#0d1230;border-radius:16px;display:flex;align-items:center;justify-content:center;min-height:300px;overflow:hidden}
.det .ph img{max-width:100%;max-height:62vh;display:block}
.det h2{margin:4px 0 8px;font-size:26px}
.det .desc{line-height:1.7;font-size:16px;white-space:pre-wrap;word-break:keep-all}
.det .meta{color:var(--mute);font-size:14px;margin-top:10px;line-height:1.6;word-break:break-all}
.clap{border:0;border-radius:999px;padding:10px 18px;font-size:18px;font-weight:800;background:#fff3d6;color:#9a5b00;min-height:48px}
.clap.on{background:#ffb020;color:#fff}
.notes{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.note{padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.5;word-break:break-all}
.note b{color:var(--orange)}
.list-filter{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.list-filter button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;min-height:40px}
.list-filter button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gw{border:0;background:#f5f7fb;border-radius:14px;padding:8px;text-align:left;color:var(--ink)}
.gw img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#0d1230;display:block}
.gw .n{font-weight:800;margin-top:6px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw .s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallmsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.wallmsg .m{background:#fff6c9;border-radius:12px;padding:12px;font-size:15px;line-height:1.5;word-break:break-all;box-shadow:0 2px 6px rgba(0,0,0,.06);position:relative}
.wallmsg .m:nth-child(3n+2){background:#d9f2ff}.wallmsg .m:nth-child(3n){background:#ffe1ea}
.wallmsg .m small{display:block;color:var(--mute);margin-top:6px}

/* teacher */
#teacher .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 60px}
.tcard{background:#fff;border-radius:18px;padding:20px;box-shadow:0 6px 24px rgba(30,40,80,.08);margin-top:16px}
.tcard h3{margin:0 0 10px}
.exl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.exi{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fafbfe;text-align:left;font-size:15px;color:var(--ink)}
.exi b{font-size:22px;letter-spacing:3px;display:block;margin-bottom:4px}
.codebig{font-size:56px;font-weight:900;letter-spacing:12px;margin:6px 0}
.qrs{display:flex;gap:20px;flex-wrap:wrap}
.qrs>div{text-align:center;font-size:14px;font-weight:700}
.qrbox{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line);display:inline-block}
.qrbox img,.qrbox canvas{display:block}
.linkbox{display:flex;gap:8px;margin:6px 0 12px}
.linkbox input{flex:1;font-size:14px;padding:10px;border:2px solid var(--line);border-radius:10px;min-width:0}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:700;font-size:16px}
.sw input{width:24px;height:24px}
table.wt{width:100%;border-collapse:collapse;font-size:14px}
table.wt td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:middle}
table.wt img{width:52px;height:52px;object-fit:cover;border-radius:8px;display:block}
.hid{opacity:.45}
.board{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:80;display:flex;align-items:center;justify-content:center;gap:60px;flex-wrap:wrap;padding:30px;text-align:center}
.board .codebig{font-size:110px}
@media (max-width:820px){
  .up,.det{grid-template-columns:1fr}
  .pill{max-width:42%}
  .tb{padding:10px 12px}
}
@media (max-width:900px){
  .pill{max-width:36%} .pill .on{display:none}
  .tb{padding:8px 10px;font-size:14px;gap:4px}
  #bWall .t{display:none}
}
@media (max-width:640px){
  .tb span.t{display:none}
  .pill .on{display:none}
  .looks{grid-template-columns:repeat(3,1fr)}
}
@media (max-height:520px){
  #joy{width:110px;height:110px}
  .bottombar button{width:46px;height:46px;font-size:21px}
}
.spin{width:44px;height:44px;border:5px solid #dfe6f3;border-top-color:var(--orange);border-radius:50%;animation:sp 0.9s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 로딩 -->
<section id="boot" class="screen show"><div class="center"><div style="text-align:center"><div class="spin"></div><div id="bootMsg" style="color:var(--mute);font-weight:700">전시관을 준비하고 있어요…</div></div></div></section>

<!-- 설정 필요 -->
<section id="needSetup" class="screen"><div class="center"><div class="card">
  <h1 class="logo">🛠️ 아직 설정이 안 됐어요</h1>
  <p class="sub">선생님이 먼저 <b>setup.html</b> 페이지에서 Firebase 연결을 마치고, 만들어진 <b>config.js</b> 파일을 이 페이지와 같은 곳(GitHub)에 올려야 해요.</p>
  <div class="btnrow"><a class="btn pri" style="text-decoration:none;text-align:center" href="setup.html">설정 페이지로 가기</a></div>
  <p class="small" id="needSetupDetail" style="margin-top:14px"></p>
</div></div></section>

<!-- 학생 입장 -->
<section id="join" class="screen"><div class="center"><div class="card">
  <h1 class="logo">🪐 우리 반 3D 우주 전시관</h1>
  <p class="sub">내가 찍은 천체 사진을 올리고, 친구들과 함께 3D 전시관을 걸어 다니며 구경해요.</p>
  <div id="stepCode">
    <label class="f">전시 코드 (6자리 숫자)</label>
    <input id="jCode" class="inp code-inp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000">
    <div class="btnrow"><button id="jCodeGo" class="btn pri wide">확인</button></div>
  </div>
  <div id="stepMe" style="display:none">
    <div style="background:#f1f5ff;border-radius:12px;padding:10px 14px;font-weight:700" id="jExName"></div>
    <div class="row" style="margin-top:4px">
      <div style="flex:0 0 110px"><label class="f">번호</label><input id="jNum" class="inp" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="예) 7"></div>
      <div><label class="f">이름</label><input id="jName" class="inp" maxlength="6" placeholder="예) 홍길동"></div>
    </div>
    <label class="f">옷 색깔</label>
    <div class="looks" id="jColors"></div>
    <label class="f">모자</label>
    <div class="hats" id="jHats"></div>
    <div class="btnrow"><button id="jBack" class="btn" style="flex:0 0 auto">← 코드</button><button id="jGo" class="btn pri">전시관 입장하기 🚪</button></div>
  </div>
  <div class="err" id="jErr"></div>
  <p class="small" style="text-align:right;margin:8px 0 0"><a href="?t=1" id="toTeacher">선생님 페이지</a></p>
</div></div></section>

<!-- 교사 -->
<section id="teacher" class="screen"><div class="wrap" id="tWrap"></div></section>

<!-- 천체관측관 -->
<section id="obs" class="screen">
  <div class="obar">
    <div class="pill"><span class="loc" style="background:#1c2550">🔭 천체관측관</span><span class="ttl" id="obsWho"></span></div>
    <div class="tbtns"><button class="tb or locked" id="toGal">🔒 전시관</button><button class="tb" id="obsOut" title="처음 화면">↩<span class="t">처음으로</span></button></div>
  </div>
  <iframe id="obsFrame" title="천체관측관" allow="clipboard-write; fullscreen"></iframe>
</section>

<!-- 3D 전시관 -->
<section id="world" class="screen">
  <canvas id="cv" tabindex="0"></canvas>
  <div id="cross"></div>
  <div class="hud">
    <div class="topbar">
      <div class="pill"><span class="loc" id="locTag">전시관 앞</span><span class="ttl" id="exTitle"></span><span class="on" id="online"></span></div>
      <div class="tbtns">
        <button class="tb gr" id="bUpload">📷<span class="t">사진 올리기</span></button>
        <button class="tb or" id="bList">🖼️<span class="t">작품 목록</span></button>
        <button class="tb" id="bWall">💬<span class="t">방명록</span></button>
        <button class="tb" id="bFull" title="전체 화면">⛶</button>
        <button class="tb" id="bExit">🔭<span class="t">관측관</span></button>
      </div>
    </div>
    <div id="joy"><div id="knob"></div></div>
    <div class="bottombar">
      <button data-emo="👋" aria-label="손 흔들기">👋</button>
      <button data-emo="❤️" aria-label="하트">❤️</button>
      <button data-emo="👏" aria-label="박수">👏</button>
      <i class="sep"></i>
      <button id="zIn" aria-label="가까이">＋</button>
      <button id="zOut" aria-label="멀리">－</button>
      <button id="bView" class="view">1인칭</button>
    </div>
    <button id="act" style="display:none"></button>
    <div id="hint">왼쪽 아래 동그라미를 밀어서 걷고, 화면을 끌어서 둘러봐요.<br>바닥을 누르면 그쪽으로 걸어가고, 액자를 누르면 크게 볼 수 있어요.</div>
  </div>
</section>

<div id="modal"><div id="mbox"></div></div>

function withTimeout(p,ms,msg){ let t; return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error(msg||"TIMEOUT")),ms);})]).finally(()=>clearTimeout(t)); }
function errText(e){
  const s=String((e&&(e.code||e.message))||e);
  if(/PERMISSION_DENIED|permission/i.test(s)) return "권한이 없어요. (사진 올리기가 꺼져 있거나, 전시가 닫혔을 수 있어요)";
  if(/TIMEOUT/.test(s)) return "인터넷이 느려요. 잠시 후 다시 해 보세요.";
  if(/wrong-password|invalid-credential|invalid-login|user-not-found|INVALID_LOGIN/i.test(s)) return "이메일 또는 비밀번호가 맞지 않아요.";
  if(/too-many-requests/.test(s)) return "시도가 너무 많아요. 잠시 후 다시 해 보세요.";
  if(/network/i.test(s)) return "인터넷 연결을 확인해 주세요.";
  if(/admin-restricted|operation-not-allowed/.test(s)) return "Firebase에서 익명 로그인이 켜져 있지 않아요. (선생님 설정 필요)";
  return "문제가 생겼어요: "+s;
}
function catKeyFromText(t){
  const s=String(t||"").replace(/\s/g,"");
  if(/왜소/.test(s)) return "dwarf"; if(/소행성/.test(s)) return "asteroid"; if(/위성/.test(s)) return "satellite";
  if(/혜성/.test(s)) return "comet"; if(/항성|태양|별/.test(s)) return "star"; if(/행성/.test(s)) return "planet"; return "etc";
}
function parseInfo(text){
  const out={}; let cur=null; const map={"천체이름":"name","이름":"name","분류":"cat","설명":"desc","사진출처":"src","출처":"src"};
  String(text||"").split(/\r?\n/).forEach(line=>{
    const m=line.match(/^\s*\[([^\]]+)\]\s*(.*)$/);
    if(m){ const k=map[m[1].replace(/\s/g,"")]; cur=k||null; if(k) out[k]=m[2].trim(); }
    else if(cur && line.trim()){ out[cur]=(out[cur]?out[cur]+"\n":"")+line.trim(); }
  });
  if(out.cat) out.catKey=catKeyFromText(out.cat);
  return out;
}

/* ---------- 데이터베이스 (Firebase / 테스트용 Mock) ---------- */
let DB=null;
async function makeFirebaseDB(cfg){
  const V="9.23.0";
  for(const m of ["app","auth","database"]) await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}-compat.js`);
  firebase.initializeApp(cfg.firebase);
  const auth=firebase.auth(), db=firebase.database();
  let offset=0; db.ref(".info/serverTimeOffset").on("value",s=>{offset=s.val()||0;});
  const api={
    TS:firebase.database.ServerValue.TIMESTAMP,
    now:()=>Date.now()+offset,
    get uid(){ return auth.currentUser?auth.currentUser.uid:null; },
    get email(){ return auth.currentUser&&auth.currentUser.email?auth.currentUser.email.toLowerCase():null; },
    ready(){ return new Promise(res=>{ const un=auth.onAuthStateChanged(u=>{ un(); res(u); }); }); },
    async anon(){ if(auth.currentUser) return; await auth.signInAnonymously(); },
    async login(e,p){ await auth.signInWithEmailAndPassword(e,p); },
    async logout(){ await auth.signOut(); },
    async get(p){ return (await db.ref(p).once("value")).val(); },
    set:(p,v)=>db.ref(p).set(v),
    update:(p,o)=>db.ref(p||"/").update(o),
    remove:p=>db.ref(p).remove(),
    key:p=>db.ref(p).push().key,
    on(p,cb,limit){ let r=db.ref(p); if(limit) r=r.limitToLast(limit); const f=r.on("value",s=>cb(s.val()),e=>{console.warn("listen",p,e);}); return ()=>r.off("value",f); },
    onChild(p,h){ const r=db.ref(p); const err=e=>console.warn("listen",p,e);
      const a=r.on("child_added",s=>h.add&&h.add(s.key,s.val()),err), c=r.on("child_changed",s=>h.chg&&h.chg(s.key,s.val()),err), d=r.on("child_removed",s=>h.rem&&h.rem(s.key),err);
      return ()=>{ r.off("child_added",a); r.off("child_changed",c); r.off("child_removed",d); }; },
    onDisc(p){ try{ db.ref(p).onDisconnect().remove(); }catch(e){} },
    cancelDisc(p){ try{ db.ref(p).onDisconnect().cancel(); }catch(e){} }
  };
  return api;
}
function makeMockDB(cfg){
  // 테스트 전용: 브라우저 저장소에 흉내 낸 데이터베이스
  const KEY="mockdb"; let mem={};
  try{ mem=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ mem={}; }
  let uid=sessionStorage.getItem("mockuid"); let email=sessionStorage.getItem("mockemail")||null;
  const L=new Set(); const disc=new Set(); const TS={".sv":"timestamp"};
  const segs=p=>String(p||"").split("/").filter(Boolean);
  const clone=v=>v==null?null:JSON.parse(JSON.stringify(v,(k,x)=>(x&&typeof x==="object"&&x[".sv"]==="timestamp")?Date.now():x));
  function getAt(p){ let o=mem; for(const s of segs(p)){ if(o==null||typeof o!=="object") return null; o=o[s]; } return o===undefined?null:clone(o); }
  function prune(o){ if(!o||typeof o!=="object") return o; for(const k of Object.keys(o)){ if(o[k]&&typeof o[k]==="object"){ prune(o[k]); if(!Object.keys(o[k]).length) delete o[k]; } else if(o[k]==null) delete o[k]; } return o; }
  function setAt(p,v){ const ss=segs(p); if(!ss.length){ mem=v==null?{}:clone(v); return; } let o=mem; for(let i=0;i<ss.length-1;i++){ if(o[ss[i]]==null||typeof o[ss[i]]!=="object") o[ss[i]]={}; o=o[ss[i]]; } if(v==null) delete o[ss[ss.length-1]]; else o[ss[ss.length-1]]=clone(v); prune(mem); }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){ console.warn("mock save",e); } }
  function valOf(l){ let v=getAt(l.p); if(l.limit&&v&&typeof v==="object"){ const ks=Object.keys(v).sort().slice(-l.limit); const o={}; ks.forEach(k=>o[k]=v[k]); v=o; } return v; }
  function notify(){ for(const l of [...L]){ if(!L.has(l)) continue; const v=valOf(l); const js=JSON.stringify(v);
      if(l.type==="value"){ if(js!==l.last){ l.last=js; l.cb(v); } }
      else { const prev=l.prev||{}; const cur=v&&typeof v==="object"?v:{};
        for(const k of Object.keys(cur)){ const s=JSON.stringify(cur[k]); if(!(k in prev)) l.h.add&&l.h.add(k,cur[k]); else if(prev[k]!==s) l.h.chg&&l.h.chg(k,cur[k]); }
        for(const k of Object.keys(prev)) if(!(k in cur)) l.h.rem&&l.h.rem(k);
        const np={}; for(const k of Object.keys(cur)) np[k]=JSON.stringify(cur[k]); l.prev=np; } } }
  window.addEventListener("storage",e=>{ if(e.key===KEY){ try{ mem=JSON.parse(e.newValue||"{}")||{}; }catch(x){} notify(); } });
  window.addEventListener("pagehide",()=>{ disc.forEach(p=>setAt(p,null)); save(); });
  const write=async fn=>{ await sleep(20); if(window.__mockFail) throw new Error("PERMISSION_DENIED (mock)"); fn(); save(); notify(); };
  const api={
    TS, now:()=>Date.now(),
    get uid(){ return uid; }, get email(){ return email; },
    async ready(){ return uid?{uid}:null; },
    async anon(){ if(!uid){ uid="u"+Math.random().toString(36).slice(2,10); sessionStorage.setItem("mockuid",uid); } },
    async login(e,p){ await sleep(50); if(String(e).toLowerCase()!==cfg.teacherEmail||String(p).length<6) throw {code:"auth/wrong-password"}; email=e.toLowerCase(); uid="teacher-uid"; sessionStorage.setItem("mockuid",uid); sessionStorage.setItem("mockemail",email); },
    async logout(){ uid=null; email=null; sessionStorage.removeItem("mockuid"); sessionStorage.removeItem("mockemail"); },
    async get(p){ await sleep(10); return getAt(p); },
    set:(p,v)=>write(()=>setAt(p,v)),
    update:(p,o)=>write(()=>{ for(const k of Object.keys(o)) setAt((p?p+"/":"")+k,o[k]); }),
    remove:p=>write(()=>setAt(p,null)),
    key:()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    on(p,cb,limit){ const l={type:"value",p,cb,limit}; L.add(l); setTimeout(()=>{ if(L.has(l)){ l.last=JSON.stringify(valOf(l)); cb(valOf(l)); } },5); return ()=>L.delete(l); },
    onChild(p,h){ const l={type:"child",p,h,prev:{}}; L.add(l); setTimeout(()=>{ if(L.has(l)) notify(); },5); return ()=>L.delete(l); },
    onDisc(p){ disc.add(p); }, cancelDisc(p){ disc.delete(p); },
    _mem:()=>mem, _notify:notify, _setRaw:(p,v)=>{ setAt(p,v); save(); notify(); }
  };
  return api;
}

/* ---------- 이미지 처리 ---------- */
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("이미지를 열 수 없어요")); i.src=src; }); }
function shrink(img,max,q){
  const s=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
  const w=Math.max(1,Math.round((img.naturalWidth||img.width)*s)), h=Math.max(1,Math.round((img.naturalHeight||img.height)*s));
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#000"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
  return {d:c.toDataURL("image/jpeg",q),w,h};
}
function fitSize(img,max,q,limit){ let m=max,qq=q,r=shrink(img,m,qq); let n=0; while(r.d.length>limit&&n<8){ n++; if(qq>0.55) qq-=0.08; else m=Math.round(m*0.82); r=shrink(img,m,qq); } return r; }
async function imgFromUrlViaFetch(url){
  const res=await withTimeout(fetch(url,{mode:"cors",referrerPolicy:"no-referrer"}),15000);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const b=await res.blob(); const u=URL.createObjectURL(b);
  try{ return await loadImg(u); } finally{ setTimeout(()=>URL.revokeObjectURL(u),3000); }
}

    try{ const m=await withTimeout(DB.get(`ex/${ST.code}/meta`),12000,"TIMEOUT"); if(!m){ $("#jErr").textContent="전시회가 없어졌어요. 선생님께 코드를 확인해 주세요."; return; } ST.meta=m;
      if(m.open===false&&!isTeacher()){ $("#jErr").textContent="지금은 전시관이 닫혀 있어요."; return; } }catch(e){ $("#jErr").textContent=errText(e); return; }
    const num=$("#jNum").value.replace(/\D/g,"").slice(0,2); const name=$("#jName").value.trim().replace(/\s+/g," ").slice(0,6);
    const teacher=isTeacher();
    if(!teacher && !num){ $("#jErr").textContent="번호를 입력해 주세요."; $("#jNum").focus(); return; }
    if(!name){ $("#jErr").textContent="이름을 입력해 주세요."; $("#jName").focus(); return; }
    if(badWord(name)){ $("#jErr").textContent="이름에 사용할 수 없는 말이 있어요."; return; }
    ST.me={num,name,a:this.look.a,h:this.look.h,teacher,nick:(num?num+"번 ":"")+name};
    try{ localStorage.setItem("gal-me",JSON.stringify({code:ST.code,num,name,a:this.look.a,h:this.look.h})); }catch(e){}
    if(sessionStorage.getItem("gal-add")) Gallery.enter(); else App.toObs();
  }
};

const Gallery={
  works:{}, hidden:{}, claps:{}, live:{},

    World.init();
    World.setExhibition(ST.meta);
    World.spawnMe(ST.me); World.setWorks([]); World.setGate(!!this.ticket()||isTeacher());
    const U=ST.unsub;
    U.push(DB.on(`ex/${c}/meta`,m=>{ if(!m){ this.kick("전시회가 삭제되었어요."); return; } ST.meta=m; $("#exTitle").textContent=`${m.cls||""} ${m.title||""}`.trim(); World.setExhibition(m); this.updateButtons();
      if(m.open===false&&!isTeacher()) this.kick("선생님이 전시관을 닫았어요."); }));
    U.push(DB.on(`ex/${c}/hidden`,h=>{ this.hidden=h||{}; this.refreshWorks(); }));
    U.push(DB.on(`ex/${c}/claps`,v=>{ this.claps=v||{}; }));
    U.push(DB.onChild(`ex/${c}/works`,{
      add:(k,v)=>{ this.works[k]=v; this.refreshWorks(); },

      else if(!isTeacher()&&this.uploadAllowed()&&!this.myWorks().length&&!isModalOpen()){
        openModal(`<div style="text-align:center;padding:10px"><div style="font-size:54px">🏛️</div><h2 style="margin:6px 0">${esc(ST.me.name)}, 어서 와요!</h2>
          <p class="sub">관측관에서 찍은 사진을 전시관에 걸어 볼까요?<br>전시관에 들어가려면 오른쪽 <b>🎫 매표소</b>에서 입장권을 받아요.</p>

  visible(){

  rt:0,

    $("#tOut").onclick=async()=>{ await DB.logout(); this.loginView(); };
    $("#nGo").onclick=()=>this.create();
    this.un.push(DB.on("exlist",v=>{ const el=$("#exl"); if(!el) return; const ls=Object.entries(v||{}).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
      el.innerHTML=ls.length?ls.map(([k,e])=>`<button class="exi" data-k="${k}"><b>${k}</b>${esc(e.cls||"")} · ${esc(e.title||"")}<div class="small">${e.t?new Date(e.t).toLocaleDateString("ko-KR"):""}</div></button>`).join(""):`<p class="sub">아직 전시회가 없어요. 위에서 만들어 보세요.</p>`;
      $$("#exl .exi").forEach(b=>b.onclick=()=>this.manage(b.dataset.k)); }));
  },
  async create(){
    const cls=$("#nCls").value.trim().slice(0,12), title=$("#nTtl").value.trim().slice(0,24)||"태양계 천체 사진전"; $("#nErr").textContent="";
    if(!cls){ $("#nErr").textContent="학반을 입력해 주세요."; return; }
    $("#nGo").disabled=true;
    try{
      let code=null; for(let i=0;i<8;i++){ const c=String(100000+Math.floor(Math.random()*900000)); if(!(await DB.get(`ex/${c}/meta`))){ code=c; break; } }
      if(!code) throw new Error("코드를 만들지 못했어요. 다시 눌러 주세요.");
      await withTimeout(DB.update("",{[`ex/${code}/meta`]:{cls,title,open:true,upload:true,t:DB.TS},[`exlist/${code}`]:{cls,title,t:DB.TS}}),15000,"TIMEOUT");
      this.manage(code);
    }catch(e){ $("#nErr").textContent=errText(e); } finally{ const b=$("#nGo"); if(b) b.disabled=false; }
  },
  manage(code){
    this.clear(); this.cur=code; const link=this.galleryLink(code);
    $("#tWrap").innerHTML=`<div class="row"><button class="btn sm" id="mBack" style="flex:0 0 auto">← 목록</button><h1 class="logo" style="flex:1;margin-left:10px" id="mTitle">전시회</h1></div>
      <div class="tcard"><div class="row" style="flex-wrap:wrap;align-items:flex-start;gap:24px">
        <div style="flex:1 1 300px"><div class="small">전시 코드</div><div class="codebig">${code}</div>
          <label class="f">학생 입장 링크</label><div class="linkbox"><input readonly value="${esc(link)}" id="lk1"><button class="btn sm" data-copy="lk1">복사</button></div>
          <p class="small" style="margin:0 0 6px">학생은 이 링크(QR) 하나로 <b>망원경 조립 → 밤하늘 관측 → 전시관</b>까지 모두 해요.</p>
          <div class="btnrow"><button class="btn navy" id="mBoard">📺 칠판에 크게 띄우기</button><button class="btn grn" id="mEnter">🏛️ 전시관 들어가기</button></div>
        </div>
        <div class="qrs"><div><div class="qrbox" id="qr1"></div>학생 입장 QR</div></div>
      </div></div>
      <div class="tcard"><h3>⚙️ 설정</h3>
        <label class="sw"><input type="checkbox" id="swOpen"> 전시관 열기 <span class="small">(끄면 학생들이 들어올 수 없어요)</span></label>
        <label class="sw"><input type="checkbox" id="swUp"> 학생 사진 올리기 허용</label>
        <div class="btnrow"><button class="btn sm" id="mEdit" style="flex:0 0 auto">✏️ 학반·제목 바꾸기</button><button class="btn sm" id="mWallClear" style="flex:0 0 auto">💬 방명록 비우기</button><button class="btn sm" id="mDel" style="flex:0 0 auto;background:#fde2e1;color:#b42318">🗑️ 전시회 삭제</button></div></div>
      <div class="tcard"><h3>💬 한 줄 감상 · 방명록 관리 <span class="small">(비꼬는 말 등은 여기서 바로 지워요)</span></h3>
        <div class="list-filter" id="cmTab"><button class="on" data-t="notes">한 줄 감상</button><button data-t="wall">방명록</button></div>
        <div style="overflow:auto;max-height:420px"><table class="wt" id="cmList"></table></div></div>
      <div class="tcard"><h3>🖼️ 작품 <span class="small" id="wCnt"></span></h3><div style="overflow:auto"><table class="wt" id="wt"></table></div></div>`;
    $("#mBack").onclick=()=>this.listView();
    $$("[data-copy]").forEach(b=>b.onclick=()=>{ const i=$("#"+b.dataset.copy); if(!i.value) return; i.select(); try{ navigator.clipboard.writeText(i.value).then(()=>toast("복사했어요!"),()=>{ document.execCommand("copy"); toast("복사했어요!"); }); }catch(e){ document.execCommand("copy"); toast("복사했어요!"); } });
    const drawQR=(el,txt)=>{ el.innerHTML=""; if(!txt){ el.innerHTML='<div class="small" style="width:180px;height:180px;display:flex;align-items:center;justify-content:center;text-align:center">관측관 주소를<br>저장하면 생겨요</div>'; return; } if(typeof QRCode==="undefined"){ el.innerHTML='<div class="small" style="width:180px">QR을 불러오지 못했어요.<br>링크를 복사해서 쓰세요.</div>'; return; } new QRCode(el,{text:txt,width:180,height:180,correctLevel:QRCode.CorrectLevel.M}); };
    drawQR($("#qr1"),link);
    $("#mBoard").onclick=()=>{ const d=document.createElement("div"); d.className="board"; d.innerHTML=`<div><div style="font-size:30px;font-weight:800" id="bdT"></div><div style="font-size:26px;margin-top:20px;opacity:.8">전시 코드</div><div class="codebig">${code}</div><div style="font-size:20px;opacity:.7">화면 아무 곳이나 누르면 닫혀요</div></div><div class="qrbox" id="bq" style="padding:16px"></div>`; document.body.appendChild(d);
      $("#bdT").textContent=$("#mTitle").textContent; const big=link; if(typeof QRCode!=="undefined") new QRCode($("#bq"),{text:big,width:320,height:320,correctLevel:QRCode.CorrectLevel.M}); d.onclick=()=>d.remove(); };
    $("#mEnter").onclick=async()=>{ const m=await DB.get(`ex/${code}/meta`); if(!m) return; ST.code=code; ST.meta=m; const s=Join.saved()||{}; ST.me={num:"",name:"선생님",a:s.a|0,h:s.h|0,teacher:true,nick:"선생님"}; this.clear(); Gallery.enter(); };
    let meta=null;
    this.un.push(DB.on(`ex/${code}/meta`,m=>{ if(!m){ if(this.cur===code){ toast("전시회가 없어요."); this.listView(); } return; } meta=m; $("#mTitle").textContent=`${m.cls||""} · ${m.title||""}`; $("#swOpen").checked=m.open!==false; $("#swUp").checked=m.upload!==false; }));
    $("#swOpen").onchange=e=>DB.set(`ex/${code}/meta/open`,e.target.checked).then(()=>toast(e.target.checked?"전시관을 열었어요.":"전시관을 닫았어요.")).catch(x=>toast(errText(x)));
    $("#swUp").onchange=e=>DB.set(`ex/${code}/meta/upload`,e.target.checked).then(()=>toast(e.target.checked?"학생 사진 올리기를 켰어요.":"학생 사진 올리기를 껐어요.")).catch(x=>toast(errText(x)));
    $("#mEdit").onclick=()=>{ if(!meta) return; openModal(`<h2 style="margin-top:0">✏️ 학반·제목 바꾸기</h2><label class="f">학반</label><input id="eC" class="inp" maxlength="12" value="${esc(meta.cls||"")}"><label class="f">전시 제목</label><input id="eT" class="inp" maxlength="24" value="${esc(meta.title||"")}"><div class="btnrow"><button class="btn pri" id="eGo">저장</button></div>`);
      $("#eGo").onclick=async()=>{ const cls=$("#eC").value.trim().slice(0,12), title=$("#eT").value.trim().slice(0,24); if(!cls||!title) return; try{ await DB.update("",{[`ex/${code}/meta/cls`]:cls,[`ex/${code}/meta/title`]:title,[`exlist/${code}/cls`]:cls,[`exlist/${code}/title`]:title}); closeModal(); toast("바꿨어요."); }catch(e){ toast(errText(e)); } }; };
    $("#mWallClear").onclick=async()=>{ if(!await ask("방명록 글을 모두 지울까요?","모두 지우기")) return; try{ await DB.remove(`ex/${code}/wall`); toast("방명록을 비웠어요."); }catch(e){ toast(errText(e)); } };
    $("#mDel").onclick=async()=>{ if(!await ask(`전시회 ${code}를 삭제할까요?\n작품·방명록이 모두 지워지고 되돌릴 수 없어요.`,"삭제")) return;
      try{ await withTimeout(DB.update("",{[`ex/${code}`]:null,[`img/${code}`]:null,[`exlist/${code}`]:null}),20000,"TIMEOUT"); toast("삭제했어요."); this.listView(); }catch(e){ toast(errText(e)); } };
    let hidden={};
    const drawWorks=(ws)=>{ const el=$("#wt"); if(!el) return; const ls=Object.entries(ws||{}).sort((a,b)=>(b[1].t||0)-(a[1].t||0)); $("#wCnt").textContent=`(${ls.length}점)`;
      el.innerHTML=ls.length?ls.map(([k,w])=>`<tr class="${hidden[k]?"hid":""}"><td style="width:60px"><img src="${esc(w.th)}" alt=""></td><td><b>${esc(w.name)}</b><div class="small">${(CATS[w.cat]||CATS.etc).name} · ${esc(w.nick||"")}</div></td><td class="small">${w.t?new Date(w.t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):""}</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-h="${k}">${hidden[k]?"보이기":"숨기기"}</button> <button class="btn sm" data-d="${k}" style="background:#fde2e1;color:#b42318">삭제</button></td></tr>`).join(""):`<tr><td class="sub">아직 올라온 작품이 없어요.</td></tr>`;
      $$("#wt [data-h]").forEach(b=>b.onclick=()=>DB.set(`ex/${code}/hidden/${b.dataset.h}`,hidden[b.dataset.h]?null:true).catch(e=>toast(errText(e))));
      $$("#wt [data-d]").forEach(b=>b.onclick=async()=>{ const k=b.dataset.d; const w=(lastW||{})[k]; if(!await ask(`'${w?w.name:""}' 작품을 삭제할까요?`,"삭제")) return;
        try{ await DB.update("",{[`ex/${code}/works/${k}`]:null,[`img/${code}/${k}`]:null,[`ex/${code}/claps/${k}`]:null,[`ex/${code}/notes/${k}`]:null,[`ex/${code}/hidden/${k}`]:null}); toast("삭제했어요."); }catch(e){ toast(errText(e)); } }); };
    let lastW=null;
    this.un.push(DB.on(`ex/${code}/hidden`,h=>{ hidden=h||{}; drawWorks(lastW); }));
    this.un.push(DB.on(`ex/${code}/works`,w=>{ lastW=w; drawWorks(w); drawCm(); }));
    let cmT="notes", notesV=null, wallV=null;
    const tm=x=>x?new Date(x).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):"";
    const drawCm=()=>{ const el=$("#cmList"); if(!el) return; let rows=[];
      if(cmT==="notes"){ Object.entries(notesV||{}).forEach(([wid,ns])=>Object.entries(ns||{}).forEach(([nid,n])=>rows.push({p:`ex/${code}/notes/${wid}/${nid}`,where:((lastW||{})[wid]||{}).name||"(지운 작품)",n})) ); }
      else Object.entries(wallV||{}).forEach(([mid,n])=>rows.push({p:`ex/${code}/wall/${mid}`,where:"방명록",n}));
      rows.sort((a,b)=>(b.n.t||0)-(a.n.t||0));
      el.innerHTML=rows.length?rows.map((r,i)=>`<tr><td style="width:120px" class="small">${esc(r.where)}</td><td><b>${esc(r.n.n)}</b> ${esc(r.n.m)}</td><td class="small" style="white-space:nowrap">${tm(r.n.t)}</td><td style="text-align:right"><button class="btn sm" data-i="${i}" style="background:#fde2e1;color:#b42318">삭제</button></td></tr>`).join(""):`<tr><td class="sub">아직 글이 없어요.</td></tr>`;
      $$("#cmList [data-i]").forEach(b=>b.onclick=async()=>{ const r=rows[+b.dataset.i]; if(!await ask(`'${r.n.m}'\n이 글을 삭제할까요?`,"삭제")) return; DB.remove(r.p).then(()=>toast("삭제했어요.")).catch(e=>toast(errText(e))); }); };
    $$("#cmTab button").forEach(b=>b.onclick=()=>{ cmT=b.dataset.t; $$("#cmTab button").forEach(x=>x.classList.toggle("on",x===b)); drawCm(); });
    this.un.push(DB.on(`ex/${code}/notes`,v=>{ notesV=v; drawCm(); }));
    this.un.push(DB.on(`ex/${code}/wall`,v=>{ wallV=v; drawCm(); }));
  }
};

window.addEventListener("error",e=>{ console.error("ERR",e.message); });
boot();
</script>
</body>
</html>
